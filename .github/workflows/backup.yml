name: DB Backup (control + tenants) — APAGADO

# ⛔ APAGADO el 2026-09-04. NO corre solo. Leer el "por qué" antes de
#    reactivarlo, porque reactivarlo tal cual vuelve a hacer lo mismo mal.
#
# Backup de la DB de control + todas las DBs de tenant, subido a R2.
# Corre en la infra de GitHub (independiente de Railway/VPS): al migrar al VPS,
# solo hay que apuntar los secrets BACKUP_PG* al Postgres nuevo — el script
# scripts/backup-all.sh se reutiliza tal cual.
#
# Secrets que necesita (Settings -> Secrets and variables -> Actions):
#   BACKUP_PGHOST, BACKUP_PGPORT, BACKUP_PGUSER, BACKUP_PGPASSWORD  (conexión al Postgres)
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT             (Cloudflare R2)
#   R2_BACKUP_BUCKET                                                (bucket de backups, ej. casino-backups)
#
# Retención offsite: configurar una regla de lifecycle en el bucket R2 (borrar
# objetos > N días). La purga local del script solo afecta al runner efímero.
#
# ---------------------------------------------------------------------------
# ⛔ POR QUÉ ESTÁ APAGADO
# ---------------------------------------------------------------------------
# Ese "solo hay que apuntar los secrets" de arriba NUNCA SE HIZO. El workflow se
# escribió el 2026-08-20, cuando producción era Railway, y después de mudar al
# VPS siguió corriendo cada 6 horas contra Railway.
#
# El script no recibe una lista de bases: se la pregunta a la DB
# (SELECT slug FROM tenants). Así que dumpeaba lo que hubiera en el
# platform_control de BACKUP_PGHOST — o sea `tenant_demo_casino`, la producción
# VIEJA. Producción hoy es `tenant_miamihub`.
#
# El daño no era perder backups (Dokploy respalda prod bien, y su restore se
# probó el 2026-09-04): era que estos dumps caen en el MISMO bucket, son más
# frecuentes y más grandes que los buenos, y en una caída alguien apurado agarra
# el archivo equivocado. Un backup que engaña es peor que no tenerlo.
#
# ---------------------------------------------------------------------------
# SI ALGÚN DÍA SE REACTIVA
# ---------------------------------------------------------------------------
# 1. Repuntar BACKUP_PGHOST/PORT/USER/PASSWORD al Postgres del VPS.
# 2. OJO: en el VPS el puerto de Postgres está CERRADO y se abre a mano y
#    temporalmente (docs/24-entornos-deploy.md). Reactivar esto exigiría dejarlo
#    expuesto a internet 24/7 — por eso se apagó en vez de repuntarlo.
# 3. Mandarlo a un prefijo propio del bucket, no a la raíz junto a Dokploy.
#
# Lo que se pierde con esto apagado: el scheduler ahora vive en el mismo host
# que la DB (Dokploy), así que si el VPS muere no se generan backups NUEVOS. Los
# viejos siguen en R2, que es lo que importa.

on:
  # ⛔ Schedule desactivado: apuntaba a la Postgres vieja de Railway.
  #    Antes de reactivar, leer el bloque "SI ALGÚN DÍA SE REACTIVA" de arriba.
  # schedule:
  #   - cron: '0 */6 * * *' # cada 6 horas (00/06/12/18 UTC = 21/03/09/15 AR)
  workflow_dispatch: {} # solo a mano, y solo después de repuntar los secrets

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar postgresql-client + rclone
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          # pg_dump debe ser >= la versión del servidor. El Postgres de prod es
          # v18, así que instalamos el cliente 18.
          sudo apt-get install -y postgresql-client-18
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone para R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          region = auto
          no_check_bucket = true
          # Path-style: pone el bucket en la RUTA, no como subdominio. Evita el
          # 'tls: handshake failure' (el cert wildcard de R2 no cubre el
          # subdominio de 2 niveles bucket.cuenta.r2.cloudflarestorage.com).
          force_path_style = true
          EOF

      - name: Preflight — probar conexión a Postgres (falla en 15s)
        env:
          PGHOST: ${{ secrets.BACKUP_PGHOST }}
          PGPORT: ${{ secrets.BACKUP_PGPORT }}
          PGUSER: ${{ secrets.BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          PGCONNECT_TIMEOUT: '15'
          PGSSLMODE: 'require'
        run: |
          echo "Probando conexión a la DB de control (host: $PGHOST puerto: $PGPORT)..."
          psql -d platform_control -c 'SHOW server_version;'
          echo "== CONEXION OK =="

      - name: Correr backup
        env:
          PGHOST: ${{ secrets.BACKUP_PGHOST }}
          PGPORT: ${{ secrets.BACKUP_PGPORT }}
          PGUSER: ${{ secrets.BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          # Falla rápido (15s) si no puede conectar, en vez de colgarse.
          PGCONNECT_TIMEOUT: '15'
          # Railway exige TLS en la conexión pública (require = encripta sin
          # verificar el cert self-signed).
          PGSSLMODE: 'require'
          # rclone: fallar rápido si no puede subir a R2 (en vez de colgarse).
          RCLONE_CONTIMEOUT: '20s'
          RCLONE_TIMEOUT: '120s'
          RCLONE_RETRIES: '2'
          RCLONE_LOW_LEVEL_RETRIES: '3'
          BACKUP_DIR: ${{ runner.temp }}/backups
          RCLONE_REMOTE: r2:${{ secrets.R2_BACKUP_BUCKET }}
          RETENTION_DAYS: '30'
        run: bash scripts/backup-all.sh

      - name: Ver backup.log (diagnóstico de errores)
        if: always()
        run: cat "${{ runner.temp }}/backups/backup.log" 2>/dev/null || echo "(sin backup.log)"

      - name: Resumen
        if: always()
        run: |
          echo "Ver el log de arriba: cada '✓ ...dump (N bytes)' es un backup OK."
          echo "Los dumps se subieron a R2 bajo r2:${{ secrets.R2_BACKUP_BUCKET }}/YYYY/MM/DD/"
