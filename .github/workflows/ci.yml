name: CI

# Validación automática en cada push a main y en cada PR.
#
# Pipeline (ver `docs/14-roadmap.md` para contexto del proyecto):
#   1. install   — pnpm install con cache
#   2. lint      — turbo run lint (ESLint en todos los packages)
#   3. type-check — turbo run type-check (TS estricto)
#   4. test-api  — jest E2E del backend contra Postgres ephemeral
#   5. build     — turbo run build de todos los packages
#
# Los tests del API (jest) requieren Postgres real. Lo levantamos como
# service container, migramos+seedeamos `platform_control`, y dejamos que
# `globalSetup` de jest provisione la tenant DB de test.
#
# Los tests E2E (Playwright) NO corren acá — requieren API+web up además de
# Postgres+Redis, y el setup es costoso. Si querés agregarlos, mirá el
# job comentado al final.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs viejos del mismo branch cuando hay push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.0.8'

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Job 1: lint + type-check (rápido, no requiere DB)
  # ──────────────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

  # ──────────────────────────────────────────────────────────────────
  # Job 2: tests del backend (jest E2E) contra Postgres ephemeral
  # ──────────────────────────────────────────────────────────────────
  test-api:
    name: Test API (jest + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: platform_control
        ports:
          - 5432:5432
        # Health check para asegurar que Postgres está listo antes
        # de los tests. Sin esto, el primer query puede fallar.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Las URLs apuntan al service container.
      DATABASE_URL_CONTROL: postgresql://postgres:admin@localhost:5432/platform_control
      DATABASE_URL_TENANT_TEMPLATE: postgresql://postgres:admin@localhost:5432/<tenant_db>
      # JWT secrets fake — solo para tests, no afectan seguridad.
      JWT_ACCESS_SECRET: ci-access-secret-not-for-prod-use-only-testing-purposes-here
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-prod-use-only-testing-purposes-here
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      NODE_ENV: test
      LOG_LEVEL: error
      # Disable Redis-backed features que jest globalSetup ya marca off.
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generar el .env.local que jest necesita (loadEnv lo lee).
      # Lo armamos del env del job para evitar duplicación.
      - name: Provision apps/api/.env.local
        run: |
          cat > apps/api/.env.local <<EOF
          PORT=3000
          NODE_ENV=test
          DATABASE_URL_CONTROL=${DATABASE_URL_CONTROL}
          DATABASE_URL_TENANT_TEMPLATE=${DATABASE_URL_TENANT_TEMPLATE}
          REDIS_URL=${REDIS_URL}
          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_ACCESS_TTL=${JWT_ACCESS_TTL}
          JWT_REFRESH_TTL=${JWT_REFRESH_TTL}
          LOG_LEVEL=${LOG_LEVEL}
          EOF

      # platform_control ya existe (creado por service postgres con
      # POSTGRES_DB). Migrar + seed.
      - name: Setup control DB
        run: |
          pnpm --filter @casino/db db:migrate:control
          pnpm --filter @casino/db db:seed:control

      # Jest se encarga de drop+create+migrate+seed del tenant test
      # vía globalSetup. Acá solo corremos.
      - name: Run API tests
        run: pnpm --filter @casino/api test

  # ──────────────────────────────────────────────────────────────────
  # Job 3: build de todos los packages
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build (turbo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Build no depende de tests porque queremos detectar errores de
    # compilación rápido aunque los tests rompan por algo no relacionado.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Next.js a veces necesita un placeholder para vars públicas
          # en build time. Si emerge un error "missing env" en build,
          # agregarlo acá.
          NEXT_TELEMETRY_DISABLED: '1'

  # ──────────────────────────────────────────────────────────────────
  # Resumen — falla el workflow si cualquier job falló.
  # Útil para "required status checks" en branch protection.
  # ──────────────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-api, build]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.lint-and-typecheck.result }}" != "success" ] || \
             [ "${{ needs.test-api.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Uno o más jobs fallaron. Ver detalles arriba."
            exit 1
          fi
          echo "✅ Todos los jobs verde."

# ──────────────────────────────────────────────────────────────────
