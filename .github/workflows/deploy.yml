name: CI + Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

  migrate:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate control DB
        run: pnpm --filter @casino/db db:migrate:control
        env:
          DATABASE_URL_CONTROL: ${{ secrets.DATABASE_URL_CONTROL }}

      - name: Migrate tenant DBs
        run: pnpm --filter @casino/db db:migrate:tenants
        env:
          DATABASE_URL_CONTROL: ${{ secrets.DATABASE_URL_CONTROL }}

  deploy:
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Railway deploy (GraphQL API)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          ENV_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$SERVICE_ID" ] || [ -z "$ENV_ID" ]; then
            echo "⚠️ RAILWAY_API_TOKEN / RAILWAY_SERVICE_ID / RAILWAY_ENVIRONMENT_ID not set"
            echo "   → skipping Railway deploy (auto-deploy from GitHub still active)"
            exit 0
          fi
          echo "🚂 Triggering Railway deploy..."
          RESPONSE=$(curl -s -X POST "https://api.railway.app/graphql/v2" \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "query": "mutation Deploy($serviceId: String!, $environmentId: String!, $commitSha: String!) { serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId, commitSha: $commitSha) { id status } }",
              "variables": {
                "serviceId": "'"$SERVICE_ID"'",
                "environmentId": "'"$ENV_ID"'",
                "commitSha": "'"${{ github.sha }}"'"
              }
            }')
          echo "$RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.data.serviceInstanceDeployV2.id // empty')
          if [ -n "$DEPLOY_ID" ]; then
            echo "✅ Railway deploy triggered: $DEPLOY_ID"
            echo "deploy-id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Railway deploy failed — check API token + IDs"
            echo "$RESPONSE" | jq '.errors // empty'
            exit 1
          fi
        id: railway

      - name: Trigger Vercel deploy hook
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_HOOK" ]; then
            echo "⚠️ VERCEL_DEPLOY_HOOK not set — skipping Vercel deploy"
          else
            RESPONSE=$(curl -s -X POST "$VERCEL_HOOK")
            echo "$RESPONSE"
            JOB_ID=$(echo "$RESPONSE" | jq -r '.job.id // empty')
            if [ -n "$JOB_ID" ]; then
              echo "✅ Vercel deploy triggered: $JOB_ID"
            else
              echo "⚠️ Vercel hook responded but no job id"
            fi
          fi

  healthcheck:
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for deploy propagation
        run: sleep 15

      - name: Health check — API
        env:
          API_URL: ${{ secrets.API_HEALTH_URL || 'https://plataforma-casino-production.up.railway.app' }}
        run: |
          echo "Checking API at $API_URL/health"
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "✅ API healthy (200)"
              exit 0
            fi
            echo "  attempt $i/12 — got $status, retrying in 10s..."
            sleep 10
          done
          echo "❌ API health check failed after 12 attempts"
          exit 1

      - name: Health check — Web
        env:
          WEB_URL: ${{ secrets.WEB_HEALTH_URL || 'https://plataforma-casino-web-ur4.vercel.app' }}
        run: |
          echo "Checking Web at $WEB_URL"
          for i in $(seq 1 6); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "✅ Web healthy (200)"
              exit 0
            fi
            echo "  attempt $i/6 — got $status, retrying in 10s..."
            sleep 10
          done
          echo "⚠️ Web health check did not get 200 (might be expected for static)"
          # Don't fail — Vercel can return 308/301 for static sites
