name: CI + Migrate (STAGING)

# Entorno de PRUEBA (staging). Se dispara con push a la rama `staging`.
#
# Este workflow SOLO corre CI (build/type-check) + migraciones contra la DB de
# staging (Railway). Los DEPLOYS de staging los hace la INTEGRACIÓN NATIVA de
# Railway y Vercel (ambos configurados para auto-deploy desde la rama `staging`
# en sus dashboards) — por eso acá no hay pasos de deploy.
#
# PRODUCCIÓN vive en el VPS (Dokploy) y se deploya con push a `main` vía el
# webhook de Dokploy (autoDeploy). Ver docs/24-entornos-deploy.md.
on:
  push:
    branches: [staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

  migrate:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate control DB
        run: pnpm --filter @casino/db db:migrate:control
        env:
          DATABASE_URL_CONTROL: ${{ secrets.DATABASE_URL_CONTROL }}

      - name: Migrate tenant DBs
        run: pnpm --filter @casino/db db:migrate:tenants
        env:
          DATABASE_URL_CONTROL: ${{ secrets.DATABASE_URL_CONTROL }}
