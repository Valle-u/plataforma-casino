name: CI + Migrate (STAGING) — APAGADO

# ⛔ APAGADO el 2026-09-04. NO corre solo.
#
# Este workflow NUNCA deployó nada: los deploys de staging los hacían las
# integraciones NATIVAS de Railway y Vercel (auto-deploy desde `staging`,
# configurado en sus dashboards). Acá sólo había CI + migraciones.
#
# ---------------------------------------------------------------------------
# ⛔ POR QUÉ ESTÁ APAGADO
# ---------------------------------------------------------------------------
# El job `migrate` corre las migraciones contra `DATABASE_URL_CONTROL`, que
# apunta a la **Postgres de staging en Railway**. Al dar de baja Railway ese job
# empieza a fallar en rojo en cada push a `staging`.
#
# Y de fondo: el 2026-09-04 se decidió que **el staging se muda a Dokploy** (no
# se usan más Railway ni Vercel para probar), así que este workflow queda
# obsoleto entero. Ver docs/DEVLOG.md y docs/24-entornos-deploy.md.
#
# ---------------------------------------------------------------------------
# EL CI DE `staging` NO SE PERDIÓ
# ---------------------------------------------------------------------------
# Apagar esto dejaba a `staging` sin ningún chequeo. Para no meter esa regresión
# se agregó `staging` a los triggers de **`ci.yml`**, que es estrictamente mejor
# que el job `ci` de acá: además de lint/build/type-check corre la **suite de
# tests** con Postgres y Redis de verdad.
#
# ---------------------------------------------------------------------------
# CUANDO SE ARME EL STAGING EN DOKPLOY
# ---------------------------------------------------------------------------
# No reactivar esto tal cual. Lo que hace falta es otra cosa:
# 1. Apps de staging en Dokploy con autoDeploy desde `staging` (webhooks propios:
#    Dokploy filtra por rama, sin su propio refreshToken el push no dispara nada).
# 2. DBs de staging SEPARADAS de producción.
# 3. Las migraciones, decidir si por MIGRATE_ON_BOOT (como prod) o a mano.
# 4. Borrar el secret `DATABASE_URL_CONTROL`, que apunta a Railway.

on:
  # ⛔ Trigger desactivado: el job `migrate` apunta a la Postgres de Railway.
  # push:
  #   branches: [staging]
  workflow_dispatch: {} # sólo a mano, y sólo si se repuntó DATABASE_URL_CONTROL

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Type-check
        run: pnpm type-check

  migrate:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate control DB
        run: pnpm --filter @casino/db db:migrate:control
        env:
          DATABASE_URL_CONTROL: ${{ secrets.DATABASE_URL_CONTROL }}

      - name: Migrate tenant DBs
        run: pnpm --filter @casino/db db:migrate:tenants
        env:
          DATABASE_URL_CONTROL: ${{ secrets.DATABASE_URL_CONTROL }}
